name: Aktualizacja Agregatora Newsow

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # Te dwie linijki poniżej załatwiają sprawę uprawnień automatycznie:
    permissions:
      contents: write
    steps:
    - name: Pobranie kodu z repozytorium
      uses: actions/checkout@v4

    - name: Przygotowanie srodowiska Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Uruchomienie bota w Pythonie
      run: python bot.py

    - name: Zapisanie wygenerowanej strony i wyslanie do repozytorium
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add index.html
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automatyczna aktualizacja newsow" && git push)
